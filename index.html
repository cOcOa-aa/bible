<!doctype html>
<html lang="ko">
<head>

<meta name="theme-color" content="#f5f1e8">
<title>말씀 한 장 — 성경 암기</title>
<style>
:root{--bg:#f5f1e8;--paper:#fffdf8;--ink:#282b27;--muted:#77796f;--line:#e4dfd3;--accent:#516b55;--accent2:#dce6d8;--shadow:0 14px 40px rgba(48,50,40,.09)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;min-height:100dvh}button,input,textarea{font:inherit}button{cursor:pointer}.app{max-width:760px;margin:0 auto;padding:22px 18px calc(30px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}.brand{font-size:13px;letter-spacing:.12em;color:var(--accent);font-weight:800}h1{font-size:25px;line-height:1.25;margin:5px 0 0;letter-spacing:-.04em}.pill{border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-size:12px;color:var(--muted);background:rgba(255,253,248,.65)}.progress-wrap{height:5px;background:#e7e1d6;border-radius:20px;overflow:hidden;margin:0 0 10px}.progress{height:100%;width:0;background:var(--accent);transition:width .2s}.meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin-bottom:18px}.card{position:relative;width:100%;min-height:340px;border:1px solid var(--line);border-radius:28px;background:var(--paper);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;text-align:center;padding:34px 24px;overflow:hidden;transition:background .2s}.card:focus-visible{outline:3px solid #8ba68b;outline-offset:3px}.card::before{content:"";position:absolute;width:180px;height:180px;border:1px solid #eeeadf;border-radius:50%;top:-95px;right:-75px}.card::after{content:"";position:absolute;width:130px;height:130px;border:1px solid #eeeadf;border-radius:50%;bottom:-80px;left:-45px}.card-inner{position:relative;z-index:1;width:100%}.side-label{font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--accent);margin-bottom:20px}.card-text{font-size:clamp(23px,5.5vw,34px);font-weight:650;line-height:1.65;letter-spacing:-.04em;white-space:pre-wrap;overflow-wrap:anywhere}.card-text.ref{font-size:clamp(27px,6vw,38px);letter-spacing:-.045em}.hint{font-size:12px;color:#96968b;margin-top:24px}.controls{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:10px;margin:17px 0 12px}.btn{border:1px solid var(--line);border-radius:15px;padding:13px 10px;background:var(--paper);color:var(--ink);font-weight:700}.btn.primary{background:var(--accent);border-color:var(--accent);color:white}.btn:active{transform:scale(.985)}.btn:disabled{opacity:.35;cursor:not-allowed}.secondary{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 18px}.secondary .btn{flex:1;min-width:120px;font-size:13px;padding:11px}.statusline{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:#e8ede3;border:1px solid #d8e1d2;border-radius:14px;padding:11px 13px;margin-top:12px;font-size:13px}.statusline button{border:0;background:transparent;color:var(--accent);font-weight:800;padding:4px}.statusline .done{color:#2e653c}.settings{background:rgba(255,253,248,.72);border:1px solid var(--line);border-radius:18px;padding:14px 15px;margin-top:18px}.settings summary{font-weight:750;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}.settings summary::after{content:"＋";color:var(--accent)}.settings[open] summary::after{content:"−"}.settings-body{padding-top:15px}.setting-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;font-size:14px}select{border:1px solid var(--line);background:white;border-radius:10px;padding:9px;max-width:58%}.note{font-size:12px;line-height:1.65;color:var(--muted);margin:12px 0 0}footer{text-align:center;font-size:11px;color:#929287;margin-top:22px}.overlay{position:fixed;inset:0;background:rgba(25,28,24,.48);display:none;align-items:flex-end;justify-content:center;padding:12px;z-index:5}.overlay.show{display:flex}.modal{width:min(100%,620px);max-height:90dvh;overflow:auto;background:var(--paper);border-radius:24px;padding:22px;box-shadow:0 20px 70px #0002}.modal-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.modal h2{font-size:20px;margin:0 0 6px}.close{border:0;background:#eeeae0;border-radius:50%;width:36px;height:36px;font-size:20px}.modal p{font-size:13px;color:var(--muted);line-height:1.6}textarea{width:100%;min-height:140px;resize:vertical;border:1px solid var(--line);border-radius:14px;padding:13px;background:white;line-height:1.7;outline-color:var(--accent)}.modal-actions{display:flex;gap:9px;margin-top:12px}.modal-actions .btn{flex:1}.small-link{border:0;background:transparent;color:var(--accent);text-decoration:underline;font-size:13px;padding:10px 0}.quiz-question{font-size:22px;font-weight:750;line-height:1.55;margin:20px 0}.quiz-options{display:grid;gap:9px}.quiz-option{border:1px solid var(--line);background:#fff;border-radius:13px;padding:13px 14px;text-align:left;line-height:1.5}.quiz-option.selected{border-color:var(--accent);background:#edf2e9}.quiz-feedback{padding:13px;border-radius:12px;margin-top:12px;font-size:14px;line-height:1.6;background:#f0eee7}.quiz-actions{display:flex;gap:9px;margin-top:14px}.quiz-actions .btn{flex:1}.badge-done{display:inline-flex;align-items:center;gap:5px;color:#2e653c;background:#e3eddf;padding:5px 9px;border-radius:99px;font-size:11px;font-weight:800}.card-done{position:absolute;top:14px;right:14px;z-index:2}.type-test-result{margin-top:14px;padding:12px 14px;border-radius:14px;background:#e3eddf;color:#2e653c;font-weight:750;word-break:break-all}.type-test-result.wrong{background:#f7e7df;color:#8b4430}.type-test-expected{margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:12px;line-height:1.7;white-space:pre-wrap}.card.is-mastered{border:3px solid #3f7550;background:#d7ead8;box-shadow:0 14px 40px rgba(48,90,55,.18),inset 0 0 0 4px rgba(255,255,255,.42)}.card.is-mastered::before,.card.is-mastered::after{border-color:rgba(48,100,60,.22)}.card.is-mastered .side-label{color:#285b36}.card.is-mastered .card-text{color:#204b2c}.card.is-mastered .hint{color:#3f7550}.card.is-mastered .card-done{background:#2f6b42;color:#fff;padding:7px 12px;font-size:12px;box-shadow:0 3px 10px rgba(30,70,40,.16)}
.mic-btn{background:#e8ede3;border:1px solid #d8e1d2;border-radius:12px;padding:10px 14px;font-size:13px;font-weight:700;color:var(--accent);display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:8px}.mic-btn.recording{background:#f7e7df;color:#8b4430;border-color:#e8c2b5;animation:pulse 1.5s infinite}@keyframes pulse{0%{opacity:1}50%{opacity:.6}100%{opacity:1}}
@media(min-width:600px){.app{padding-top:32px}.card{min-height:390px}.overlay{align-items:center}}
</style>
</head>
<body>
<main class="app">
<header class="top"><div><div class="brand">WORD · MEMORY</div><h1>말씀 한 장</h1></div><div class="pill">개역개정 · 암송 카드</div></header>
<div class="progress-wrap"><div class="progress" id="progress"></div></div>
<div class="meta"><span id="counter">1 / 50</span><span id="filterStatus">암송 말씀 50선</span></div>
<button class="card" id="card" type="button" aria-label="카드를 뒤집습니다"><div class="card-inner"><div class="side-label" id="sideLabel">말씀</div><div class="card-text" id="cardText">창세기 1:1</div><div class="hint">카드를 터치하면 반대쪽이 보여요</div></div></button>
<div class="statusline"><span id="masteryStatus">아직 암기 완료로 표시하지 않았어요</span><button id="toggleMastery">✓ 암기 완료 표시</button></div>
<div class="controls"><button class="btn" id="prev">← 이전</button><button class="btn primary" id="flip">카드 뒤집기 ↻</button><button class="btn" id="next">다음 →</button></div>
<div class="secondary"><button class="btn" id="typeTestOpen">입력 테스트</button><button class="btn" id="quizOpen">랜덤 퀴즈</button><button class="btn" id="toggleFilter">외운 것만 보기</button><button class="btn" id="shuffle">순서 섞기</button></div>
<details class="settings"><summary>암기 설정</summary><div class="settings-body">
<div class="setting-row"><label for="startSide">처음 보여줄 면</label><select id="startSide"><option value="ref">말씀(장절)</option><option value="verse">구절(본문)</option></select></div>
<div class="setting-row"><label for="fontSize">글자 크기</label><select id="fontSize"><option value="small">작게</option><option value="medium" selected>보통</option><option value="large">크게</option></select></div>
<div class="setting-row"><label for="jump">말씀 바로 선택</label><select id="jump"></select></div>
<p class="note">암기 완료 상태와 학습 기록은 이 기기에 보관됩니다.</p><button class="small-link" id="export">학습 내용 백업하기</button><button class="small-link" id="importBtn">백업 불러오기</button><input type="file" id="importFile" accept="application/json,.json" hidden>
</div></details>
<footer>천천히 읽고, 기억하고, 마음에 새겨 보세요.</footer>
</main>

<div class="overlay" id="typeTestOverlay" role="dialog" aria-modal="true" aria-labelledby="typeTestTitle"><div class="modal">
<div class="modal-head"><div><h2 id="typeTestTitle">직접 입력 암기 테스트</h2><div class="pill" id="typeTestRef"></div></div><button class="close" id="closeTypeTest" aria-label="닫기">×</button></div>
<p>외운 본문을 직접 입력하거나 음성으로 말해서 테스트해 보세요. 틀린 부분만 빨간색으로 표시됩니다.</p>
<textarea id="typeTestInput" placeholder="외운 성경 본문을 직접 입력하거나 아래 음성 입력 버튼을 누르세요."></textarea>
<button class="mic-btn" id="micBtn" type="button">🎤 음성으로 입력하기 (말하기)</button>
<div class="modal-actions"><button class="btn" id="clearTypeTest">다시 입력</button><button class="btn primary" id="checkTypeTest">정답 확인</button></div>
<div id="typeTestResult" class="type-test-result" hidden></div>
<div id="typeTestExpected" class="type-test-expected" hidden></div>
</div></div>

<div class="overlay" id="quizOverlay" role="dialog" aria-modal="true" aria-labelledby="quizTitle"><div class="modal">
<div class="modal-head"><div><h2 id="quizTitle">랜덤 암기 퀴즈</h2><div class="pill" id="quizCounter">1 / 10</div></div><button class="close" id="closeQuiz" aria-label="퀴즈 닫기">×</button></div>
<div style="margin-bottom:12px; font-size:13px;"><label><input type="checkbox" id="quizMasteredOnly"> 외운 말씀만 출제하기</label></div>
<p id="quizInstructions">제시된 내용과 짝이 되는 답을 골라 보세요.</p>
<div class="quiz-question" id="quizQuestion"></div><div class="quiz-options" id="quizOptions"></div><div class="quiz-feedback" id="quizFeedback" hidden></div>
<div class="quiz-actions"><button class="btn" id="quizSkip">모르겠어요</button><button class="btn primary" id="quizNext" disabled>다음 문제 →</button></div>
</div></div>

<script>
const refs=[
"창세기 1:1","출애굽기 19:5-6","레위기 19:2","레위기 19:18","민수기 6:24-26","신명기 6:4-9","여호수아 1:8","사사기 8:23","사무엘하 7:16","열왕기상 18:21","열왕기하 22:13","역대하 31:20","욥기 1:21","시편 1:1-2","시편 119:105","잠언 1:7","전도서 12:13","아가 8:6","이사야 2:3","예레미야 31:33","요엘 2:28-29","요나 4:2 하반절","미가 3:12","하박국 2:4","말라기 4:4-6","마태복음 4:17","마태복음 28:19-20","마가복음 10:45","누가복음 4:18-19","누가복음 15:7","요한복음 3:16-17","요한복음 20:31","사도행전 1:8","로마서 1:17","로마서 8:26","고린도전서 6:19-20","고린도후서 13:13","갈라디아서 2:20","エ베소서 4:11-12","빌립보서 2:6-7","골로새서 3:1","데살로니가전서 5:16-18","디모데전서 2:1-2","빌레몬서 1:16","히브리서 11:1-2","야고보서 2:26","베드로전서 4:16","요한일서 4:10","요한이서 1:7","요한계시록 22:12-13"
];

const texts = {
  0: "태초에 하나님이 천지를 창조하시니라",
  1: "5 세계가 다 내게 속하였나니 너희가 내 말을 잘 듣고 내 언약을 지키면 너희는 모든 민족 중에서 내 소유가 되겠고\n6 너희가 내게 대하여 제사장 나라가 되며 거룩한 백성이 되리라 너는 이 말을 이스라엘 자손에게 전할지니라",
  2: "너는 이스라엘 자손의 온 회중에게 말하여 이르라 너희는 거룩하라 이는 나 여호와 너희 하나님이 거룩함이니라",
  3: "원수를 갚지 말며 동포를 원망하지 말며 네 이웃 사랑하기를 네 자신과 같이 사랑하라 나는 여호와이니라",
  4: "24 여호와는 네게 복을 주시고 너를 지키시기를 원하며\n25 여호와는 그의 얼굴을 네게 비추사 은혜 베푸시기를 원하며\n26 여호와는 그 얼굴을 네게로 향하여 드사 평강 주시기를 원하노라 할지니라 하라",
  5: "4 이스라엘아 들으라 우리 하나님 여호와는 오직 유일한 여호와이시니\n5 너는 마음을 다하고 뜻을 다하고 힘을 다하여 네 하나님 여호와를 사랑하라\n6 오늘 내가 네게 명하는 이 말씀을 너는 마음에 새기고\n7 네 자녀에게 부지런히 가르치며 집에 앉았을 때에든지 길을 갈 때에든지 누워 있을 때에든지 일어날 때에든지 이 말씀을 강론할 것이며\n8 너는 또 그것을 네 손목에 매어 기호를 삼으며 네 미간에 붙여 표로 삼고\n9 또 네 집 문설주와 바깥 문에 기록할지니라",
  6: "이 율법책을 네 입에서 떠나지 말게 하며 주야로 그것을 묵상하여 그 안에 기록된 대로 다 지켜 행하라 그리하면 네 길이 평탄하게 될 것이며 네가 형통하리라",
  7: "기드온이 그들에게 이르되 내가 너희를 다스리지 아니하겠고 나의 아들도 너희를 다스리지 아니할 것이요 여호와께서 너희를 다스리시리라 하니라",
  8: "네 집과 네 나라가 내 앞에서 영원히 보전되고 네 왕위가 영원히 견고하리라 하셨다 하라",
  9: "엘리야가 모든 백성에게 가까이 나아가 이르되 너희가 어느 때까지 둘 사이에서 머뭇머뭇 하려느냐 여호와가 만일 하나님이면 그를 따르고 바알이 만일 하나님이면 그를 따를지니라 하니 백성이 말 한마디도 대답하지 아니하는지라",
  10: "너희는 가서 나와 백성과 온 유다를 위하여 이 발견한 책의 말씀에 대하여 여호와께 물으라 우리 조상들이 이 책의 말씀을 듣지 아니하며 이 책에 우리를 위하여 기록된 모든 것을 행하지 아니하였으므로 여호와께서 우리에게 내리신 진노가 크도다",
  11: "히스기야가 온 유다에 이같이 행하되 그의 하나님 여호와 보시기에 선과 정의와 진실함으로 행하였으니",
  12: "이르되 내가 모태에서 알몸으로 나왔사온즉 또한 알몸이 그리로 돌아가올지라 주신 이도 여호와시요 거두신 이도 여호와시오니 여호와의 이름이 찬송을 받으실지니이다 하고",
  13: "1 복 있는 사람은 악인들의 꾀를 따르지 아니하며 죄인들의 길에 서지 아니하며 오만한 자들의 자리에 앉지 아니하고\n2 오직 여호와의 율법을 즐거워하여 그의 율법을 주야로 묵상하는도다",
  14: "주의 말씀은 내 발에 등이요 내 길에 빛이니이다",
  15: "여호와를 경외하는 것이 지식의 근본이거늘 미련한 자는 지혜와 훈계를 멸시하느니라",
  16: "일의 결국을 다 들었으니 하나님을 경외하고 그의 명령들을 지킬지어다 이것이 모든 사람의 본분이니라",
  17: "너는 나를 도장 같이 마음에 품고 도장 같이 팔에 두라 사랑은 죽음 같이 강하고 질투는 스올 같이 잔인하며 불길 같이 일어나니 그 기세가 여호와의 불과 같으니라",
  18: "많은 백성이 가며 이르기를 오라 우리가 여호와의 산에 오르며 야곱의 하나님의 전에 이르자 그가 그의 길을 우리에게 가르치실 것이라 우리가 그 길로 행하리라 하리니 이는 율법이 시온에서부터 나올 것이요 여호와의 말씀이 예루살렘에서부터 나올 것임이니라",

const STORAGE_KEY="word-memory-verses-v7";
let saved={mastered:[], lastPos:0};
try{
  const raw=JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}");
  saved.mastered=Array.isArray(raw.mastered)?raw.mastered:[];
  saved.lastPos=typeof raw.lastPos==='number'?raw.lastPos:0;
}catch(e){}

let mastered = new Set(saved.mastered);
let onlyMasteredFilter = false;
let isShuffled = false;
let order = refs.map((_,i)=>i);
let pos = Math.min(Math.max(0, saved.lastPos), refs.length - 1);
let showingVerse=false;

const $=id=>document.getElementById(id),card=$("card"),cardText=$("cardText"),sideLabel=$("sideLabel");

function getActiveIndices(){
  if(onlyMasteredFilter){
    const filtered = refs.map((_,i)=>i).filter(i=>mastered.has(i));
    return filtered.length>0 ? filtered : refs.map((_,i)=>i);
  }
  return order;
}

function currentIndex(){
  const active = getActiveIndices();
  if(pos >= active.length) pos = 0;
  return active[pos] !== undefined ? active[pos] : 0;
}

function persist(){
  try{
    localStorage.setItem(STORAGE_KEY,JSON.stringify({
      mastered:[...mastered],
      lastPos: pos
    }));
  }catch(e){}
}

// 드롭다운 스타일 개선: 텍스트 대신 깔끔하게 번호와 구절만 표시하고 외운 것은 이모지(✓)와 배경색으로 표시
function updateJumpSelect(){
  const jumpSelect = $("jump");
  const currentVal = jumpSelect.value;
  jumpSelect.innerHTML = "";
  refs.forEach((r,i)=>{
    const o=document.createElement("option");
    o.value=String(i);
    const isDone = mastered.has(i);
    o.textContent = `${String(i+1).padStart(2,"0")}. ${r}${isDone ? " ✓" : ""}`;
    jumpSelect.appendChild(o);
  });
  jumpSelect.value = currentVal;
}

function render(){
  const active = getActiveIndices();
  if(pos >= active.length) pos = Math.max(0, active.length - 1);
  const idx=currentIndex(),verse=(texts[idx]||"").trim(),side=showingVerse?"verse":"ref";
  
  sideLabel.textContent=side==="ref"?"말씀":"구절";
  cardText.textContent=side==="ref"?refs[idx]:(verse||"본문을 입력해 주세요");
  
  const oldDone=$("cardDone");if(oldDone)oldDone.remove();
  if(mastered.has(idx)){
    const done=document.createElement("div");done.id="cardDone";done.className="badge-done card-done";done.textContent="✓ 암기 완료";card.appendChild(done);card.classList.add("is-mastered")
  }else{
    card.classList.remove("is-mastered")
  }
  
  cardText.className="card-text"+(side==="ref"?" ref":"");
  $("counter").textContent=`${pos+1} / ${active.length}`;
  $("filterStatus").textContent=onlyMasteredFilter?"외운 말씀 모음":"암송 말씀 50선";
  $("progress").style.width=`${((pos+1)/active.length)*100}%`;
  $("prev").disabled=pos===0;
  $("next").disabled=pos===active.length-1;
  $("jump").value=String(idx);
  
  const done=mastered.has(idx);
  $("masteryStatus").innerHTML=done?'<span class="badge-done">✓ 암기 완료</span> 이 말씀은 외웠어요':'아직 암기 완료로 표시하지 않았어요';
  $("toggleMastery").textContent=done?"↶ 완료 표시 취소":"✓ 암기 완료 표시";
  $("toggleMastery").classList.toggle("done",done);
  $("toggleFilter").textContent=onlyMasteredFilter?"전체 보기":"외운 것만 보기";
  $("shuffle").textContent = isShuffled ? "원래 순서로" : "순서 섞기";
  
  updateJumpSelect();
  persist();
}

function flip(){showingVerse=!showingVerse;render()}
function move(d){
  const active = getActiveIndices();
  pos=Math.max(0,Math.min(active.length-1,pos+d));
  showingVerse=$("startSide").value==="verse";
  render();
}

function openTypeTest(){const idx=currentIndex();$("typeTestRef").textContent=refs[idx];$("typeTestInput").value="";$("typeTestResult").hidden=true;$("typeTestExpected").hidden=true;$("typeTestOverlay").classList.add("show");setTimeout(()=>$("typeTestInput").focus(),80)}
function closeTypeTest(){$("typeTestOverlay").classList.remove("show")}
function normalizeVerse(v){return String(v||"").normalize("NFC").replace(/[\p{P}\p{S}]/gu,"").replace(/\s+/gu," ").trim()}

function getDiffHtml(typed, expected){
  const tArr = Array.from(typed);
  const eArr = Array.from(expected);
  let html = "";
  
  const n = tArr.length;
  const m = eArr.length;
  const dp = Array.from({length: n + 1}, () => Array(m + 1).fill(0));

  for (let i = 0; i <= n; i++) dp[i][0] = i;
  for (let j = 0; j <= m; j++) dp[0][j] = j;

  for (let i = 1; i <= n; i++) {
    for (let j = 1; j <= m; j++) {
      if (tArr[i - 1] === eArr[j - 1]) {
        dp[i][j] = dp[i - 1][j - 1];
      } else {
        dp[i][j] = Math.min(
          dp[i - 1][j] + 1,
          dp[i][j - 1] + 1,
          dp[i - 1][j - 1] + 1
        );
      }
    }
  }

  let i = n, j = m;
  const result = [];
  while (i > 0 || j > 0) {
    if (i > 0 && j > 0 && tArr[i - 1] === eArr[j - 1]) {
      result.unshift({type: 'equal', char: tArr[i - 1]});
      i--; j--;
    } else {
      let insertCost = j > 0 ? dp[i][j - 1] : Infinity;
      let deleteCost = i > 0 ? dp[i - 1][j] : Infinity;
      let substCost = (i > 0 && j > 0) ? dp[i - 1][j - 1] : Infinity;

      if (substCost <= insertCost && substCost <= deleteCost) {
        result.unshift({type: 'subst', char: tArr[i - 1], expected: eArr[j - 1]});
        i--; j--;
      } else if (deleteCost < insertCost) {
        result.unshift({type: 'delete', char: tArr[i - 1]});
        i--;
      } else {
        result.unshift({type: 'insert', char: eArr[j - 1]});
        j--;
      }
    }
  }

  result.forEach(item => {
    if (item.type === 'equal') {
      html += item.char;
    } else if (item.type === 'subst') {
      html += `<span style="background:#ffcdd2; color:#b71c1c; font-weight:bold; padding:0 2px; border-radius:3px;" title="정답: ${item.expected}">${item.char}</span>`;
    } else if (item.type === 'delete') {
      html += `<span style="background:#ffcdd2; color:#b71c1c; font-weight:bold; padding:0 2px; border-radius:3px;" title="불필요한 글자">${item.char}</span>`;
    } else if (item.type === 'insert') {
      html += `<span style="background:#fff9c4; color:#f57f17; font-weight:bold; padding:0 2px; border-radius:3px;" title="누락된 글자">(${item.char})</span>`;
    }
  });

  return html;
}

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if(SpeechRecognition){
  const recognition = new SpeechRecognition();
  recognition.lang = 'ko-KR';
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  $("micBtn").addEventListener("click",()=>{
    try {
      recognition.start();
      $("micBtn").classList.add("recording");
      $("micBtn").textContent = "🎙️ 듣고 있어요... 말씀해 주세요!";
    } catch(e) {
      recognition.stop();
    }
  });

  recognition.onresult = (event) => {
    const speechResult = event.results[0][0].transcript;
    const currentText = $("typeTestInput").value;
    $("typeTestInput").value = currentText ? currentText + " " + speechResult : speechResult;
    $("micBtn").classList.remove("recording");
    $("micBtn").textContent = "🎤 음성으로 입력하기 (말하기)";
  };

  recognition.onerror = () => {
    $("micBtn").classList.remove("recording");
    $("micBtn").textContent = "🎤 음성으로 입력하기 (말하기)";
    alert("음성 인식을 실패했거나 권한이 차단되었습니다.");
  };

  recognition.onend = () => {
    $("micBtn").classList.remove("recording");
    $("micBtn").textContent = "🎤 음성으로 입력하기 (말하기)";
  };
} else {
  $("micBtn").style.display = "none";
}

$("checkTypeTest").addEventListener("click",()=>{
  const idx=currentIndex(),expected=(texts[idx]||"").trim(),typed=$("typeTestInput").value.trim();
  if(!typed){
    $("typeTestResult").className="type-test-result wrong";
    $("typeTestResult").textContent="외운 본문을 먼저 입력해 주세요.";
    $("typeTestResult").hidden=false;
    $("typeTestExpected").hidden=true;
    return;
  }
  const ok=normalizeVerse(typed)===normalizeVerse(expected);
  $("typeTestResult").className="type-test-result"+(ok?"":" wrong");
  if(ok){
    $("typeTestResult").textContent="정확해요! 입력한 본문이 일치합니다.";
    $("typeTestResult").hidden=false;
    $("typeTestExpected").hidden=true;
  } else {
    $("typeTestResult").innerHTML="틀린 부분이 있어요. 아래 비교를 확인해 보세요:<br><br>" + getDiffHtml(typed, expected);
    $("typeTestResult").hidden=false;
    $("typeTestExpected").textContent="저장된 정답 본문:\n"+expected;
    $("typeTestExpected").hidden=false;
  }
});

$("shuffle").addEventListener("click",()=>{
  if(!isShuffled){
    for(let i=order.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [order[i],order[j]]=[order[j],order[i]];
    }
    isShuffled = true;
  } else {
    order = refs.map((_,i)=>i);
    isShuffled = false;
  }
  pos=0;
  showingVerse=$("startSide").value==="verse";
  render();
});

$("startSide").addEventListener("change",()=>{showingVerse=$("startSide").value==="verse";render()});
$("fontSize").addEventListener("change",e=>{cardText.style.fontSize=e.target.value==="small"?"22px":e.target.value==="large"?"clamp(30px,7vw,42px)":""});

updateJumpSelect();

$("jump").addEventListener("change",e=>{
  const idx=Number(e.target.value);
  if(onlyMasteredFilter && !mastered.has(idx)){
    alert("현재 '외운 것만 보기' 필터가 켜져 있어 해당 구절을 바로 보려면 필터를 꺼야 합니다.");
    return;
  }
  const active = getActiveIndices();
  pos=active.indexOf(idx);
  if(pos<0) pos=0;
  showingVerse=$("startSide").value==="verse";
  render();
});

$("export").addEventListener("click",()=>{const data={app:"말씀 한 장",version:7,mastered:[...mastered]};const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="말씀-암기-학습기록.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});
$("importBtn").addEventListener("click",()=>$("importFile").click());
$("importFile").addEventListener("change",async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(Array.isArray(data.mastered)){mastered=new Set(data.mastered);persist();render();alert("학습 기록을 불러왔어요.")}else{throw Error()}}catch(err){alert("백업 파일을 읽지 못했어요.")}e.target.value=""});

let quizItems=[],quizPos=0,quizScore=0,quizAnswered=false;
function closeQuiz(){$("quizOverlay").classList.remove("show")}

function makeQuiz(){
  const masteredOnly = $("quizMasteredOnly").checked;
  let sourceIndices = refs.map((r,i)=>i);
  if(masteredOnly){
    sourceIndices = sourceIndices.filter(i=>mastered.has(i));
    if(sourceIndices.length < 2){
      alert("외운 말씀이 2개 이상이어야 퀴즈를 진행할 수 있어요!");
      return;
    }
  }
  const available = sourceIndices.map(i=>({ref:refs[i],text:(texts[i]||"").trim(),i}));
  const pool=[...available].sort(()=>Math.random()-.5);
  quizItems=pool.slice(0,Math.min(10,pool.length)).map((item)=>{
    const askRef=Math.random()<.5;
    const distractors=available.filter(x=>x.i!==item.i).sort(()=>Math.random()-.5).slice(0,3);
    let options;
    if(askRef){
      options=[{label:item.ref,correct:true},...distractors.map(x=>({label:x.ref,correct:false}))]
    }else{
      options=[{label:item.text,correct:true},...distractors.map(x=>({label:x.text,correct:false})).slice(0,3)]
    }
    options.sort(()=>Math.random()-.5);
    return{item,askRef,options}
  });
  quizPos=0;quizScore=0;quizAnswered=false;
  $("quizOverlay").classList.add("show");
  renderQuiz();
}

function renderQuiz(){
  const q=quizItems[quizPos];
  if(!q){
    $("quizTitle").textContent="퀴즈 완료!";
    $("quizCounter").textContent=`점수 ${quizScore} / ${quizItems.length}`;
    $("quizInstructions").textContent="수고했어요! 다시 도전해서 기억을 확인해 보세요.";
    $("quizQuestion").textContent=`${quizItems.length}문제 중 ${quizScore}문제를 맞혔어요.`;
    $("quizOptions").innerHTML="";
    $("quizFeedback").hidden=true;
    $("quizSkip").textContent="닫기";
    $("quizNext").textContent="다시 퀴즈";
    $("quizNext").disabled=false;
    return;
  }
  quizAnswered=false;
  $("quizTitle").textContent="랜덤 암기 퀴즈";
  $("quizCounter").textContent=`${quizPos+1} / ${quizItems.length}`;
  $("quizInstructions").textContent=q.askRef?"본문을 읽고 알맞은 성경 장절을 고르세요.":"성경 장절을 보고 알맞은 본문을 고르세요.";
  $("quizQuestion").textContent=q.askRef?q.item.text:q.item.ref;
  $("quizOptions").innerHTML="";
  q.options.export ? q.options.forEach : q.options.forEach((opt,n)=>{
    const b=document.createElement("button");
    b.className="quiz-option";
    b.textContent=opt.label;
    b.addEventListener("click",()=>answerQuiz(n));
    $("quizOptions").appendChild(b)
  });
  // 안전한 렌더링을 위해 아래 루프 보정
  $("quizOptions").innerHTML="";
  q.options.forEach((opt,n)=>{
    const b=document.createElement("button");
    b.className="quiz-option";
    b.textContent=opt.label;
    b.addEventListener("click",()=>answerQuiz(n));
    $("quizOptions").appendChild(b)
  });

  $("quizFeedback").hidden=true;
  $("quizNext").disabled=true;
  $("quizNext").textContent=quizPos===quizItems.length-1?"결과 보기":"다음 문제 →";
  $("quizSkip").textContent="모르겠어요"
}

function answerQuiz(n){
  if(quizAnswered)return;
  quizAnswered=true;
  const q=quizItems[quizPos],chosen=q.options[n];
  if(chosen.correct)quizScore++;
  [...$("quizOptions").children].forEach((b,i)=>{
    b.disabled=true;
    if(q.options[i].correct)b.classList.add("selected")
  });
  $("quizFeedback").hidden=false;
  $("quizFeedback").textContent=chosen.correct?"정답이에요! 잘 기억하고 있네요.":`아쉬워요. 정답은 ${q.askRef?q.item.ref:q.item.text} 입니다.`;
  $("quizNext").disabled=false;
}

$("quizOpen").addEventListener("click",makeQuiz);
$("closeQuiz").addEventListener("click",closeQuiz);
$("quizOverlay").addEventListener("click",e=>{if(e.target===$("quizOverlay"))closeQuiz()});
$("quizSkip").addEventListener("click",()=>{if(quizPos>=quizItems.length){closeQuiz();return}if(!quizAnswered){const q=quizItems[quizPos];$("quizFeedback").hidden=false;$("quizFeedback").textContent=`정답: ${q.askRef?q.item.text:q.item.ref}`;$("quizNext").disabled=false;quizAnswered=true}else{quizPos++;renderQuiz()}});
$("quizNext").addEventListener("click",()=>{if(quizPos>=quizItems.length){makeQuiz();return}if(!quizAnswered)return;quizPos++;renderQuiz()});

document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){closeQuiz();closeTypeTest()}
  if($("quizOverlay").classList.contains("show")||$("typeTestOverlay").classList.contains("show"))return;
  if(e.key==="ArrowLeft")move(-1);
  if(e.key==="ArrowRight")move(1);
  if(e.key===" "){e.preventDefault();flip()}
});

render();
</script>
</body></html>
