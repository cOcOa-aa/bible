name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Setup App and New Bible Icon
      run: |
        mkdir -p android/app/src/main/assets
        mkdir -p android/app/src/main/res/values
        mkdir -p android/app/src/main/res/mipmap-anydpi-v26
        mkdir -p android/app/src/main/java/com/bible/verseapp
        
        cp index.html android/app/src/main/assets/index.html

        # 아이콘 배경 색상 지정 (올리브 그린)
        cat << 'EOF' > android/app/src/main/res/values/colors.xml
        <resources>
            <color name="launcher_background">#6C7D52</color>
        </resources>
        EOF

        # 안드로이드 어댑티브 아이콘 설정 (책 디자인)
        cat << 'EOF' > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
        <?xml version="1.0" encoding="utf-8"?>
        <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/launcher_background"/>
            <foreground>
                <vector xmlns:android="http://schemas.android.com/apk/res/android"
                    android:width="108dp"
                    android:height="108dp"
                    android:viewportWidth="108"
                    android:viewportHeight="108">
                    <path
                        android:fillColor="#FFFFFF"
                        android:pathData="M54,34 C42,34 31,43 27,53 C27,54 27,55 27,56 C27,67 38,76 50,76 L54,76 C66,76 77,67 77,56 C77,55 77,54 77,53 C73,43 62,34 50,34 L54,34 Z M54,71 C45,71 37,65 34,56 C34,55 34,55 34,54 C36,48 43,41 52,41 C61,41 68,48 70,54 C70,55 70,55 70,56 C67,65 59,71 50,71 L54,71 Z M53,44 L53,68 C53,69 52,69 52,68 C50,68 49,67 49,65 L49,47 C49,45 50,44 52,44 Z M56,44 L56,68 C56,69 57,69 57,68 C59,68 60,67 60,65 L60,47 C60,45 59,44 57,44 Z" />
                </vector>
            </foreground>
        </adaptive-icon>
        EOF

        cat << 'EOF' > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
        <?xml version="1.0" encoding="utf-8"?>
        <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/launcher_background"/>
            <foreground>
                <vector xmlns:android="http://schemas.android.com/apk/res/android"
                    android:width="108dp"
                    android:height="108dp"
                    android:viewportWidth="108"
                    android:viewportHeight="108">
                    <path
                        android:fillColor="#FFFFFF"
                        android:pathData="M54,34 C42,34 31,43 27,53 C27,54 27,55 27,56 C27,67 38,76 50,76 L54,76 C66,76 77,67 77,56 C77,55 77,54 77,53 C73,43 62,34 50,34 L54,34 Z M54,71 C45,71 37,65 34,56 C34,55 34,55 34,54 C36,48 43,41 52,41 C61,41 68,48 70,54 C70,55 70,55 70,56 C67,65 59,71 50,71 L54,71 Z M53,44 L53,68 C53,69 52,69 52,68 C50,68 49,67 49,65 L49,47 C49,45 50,44 52,44 Z M56,44 L56,68 C56,69 57,69 57,68 C59,68 60,67 60,65 L60,47 C60,45 59,44 57,44 Z" />
                </vector>
            </foreground>
        </adaptive-icon>
        EOF

        cat << 'EOF' > android/settings.gradle
        rootProject.name = "BibleApp"
        include ':app'
        EOF

        cat << 'EOF' > android/build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.1.1'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        cat << 'EOF' > android/app/build.gradle
        plugins {
            id 'com.android.application'
        }

        android {
            namespace 'com.bible.verseapp'
            compileSdk 33

            defaultConfig {
                applicationId "com.bible.verseapp"
                minSdk 21
                targetSdk 33
                versionCode 1
                versionName "1.0"
            }

            buildTypes {
                release {
                    minifyEnabled false
                }
            }
        }
        EOF

        cat << 'EOF' > android/app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application
                android:allowBackup="true"
                android:label="말씀 한 장"
                android:icon="@mipmap/ic_launcher"
                android:roundIcon="@mipmap/ic_launcher_round"
                android:supportsRtl="true"
                android:theme="@android:style/Theme.NoTitleBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        cat << 'EOF' > android/app/src/main/java/com/bible/verseapp/MainActivity.java
        package com.bible.verseapp;

        import android.app.Activity;
        import android.os.Bundle;
        import android.webkit.WebSettings;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;

        public class MainActivity extends Activity {
            private WebView webView;

            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                webView = new WebView(this);
                WebSettings settings = webView.getSettings();
                settings.setJavaScriptEnabled(true);
                settings.setDomStorageEnabled(true);
                settings.setAllowFileAccessFromFileURLs(true);
                settings.setAllowUniversalAccessFromFileURLs(true);
                webView.setWebViewClient(new WebViewClient());
                webView.loadUrl("file:///android_asset/index.html");
                setContentView(webView);
            }

            @Override
            public void onBackPressed() {
                if (webView.canGoBack()) {
                    webView.goBack();
                } else {
                    super.onBackPressed();
                }
            }
        }
        EOF

    - name: Build Android APK with Gradle
      run: |
        cd android
        gradle assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: 말씀한장-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
