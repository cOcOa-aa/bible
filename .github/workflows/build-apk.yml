name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Set up Python & Pillow
      run: |
        python3 -m pip install Pillow

    - name: Process Custom Icon and Setup App
      run: |
        mkdir -p android/app/src/main/assets
        mkdir -p android/app/src/main/java/com/bible/verseapp
        
        cp index.html android/app/src/main/assets/index.html

        # 업로드한 icon.png를 안드로이드 해상도별 아이콘 규격으로 자동 리사이즈
        python3 -c "
        import os
        from PIL import Image
        for size, name in [(48, 'mipmap-mdpi'), (72, 'mipmap-hdpi'), (96, 'mipmap-xhdpi'), (144, 'mipmap-xxhdpi'), (192, 'mipmap-xxxhdpi')]:
            os.makedirs(f'android/app/src/main/res/{name}', exist_ok=True)
            img = Image.open('icon.png').convert('RGBA')
            img.resize((size, size), Image.Resampling.LANCZOS).save(f'android/app/src/main/res/{name}/ic_launcher.png')
            img.resize((size, size), Image.Resampling.LANCZOS).save(f'android/app/src/main/res/{name}/ic_launcher_round.png')
        "

        cat << 'EOF' > android/settings.gradle
        rootProject.name = "BibleApp"
        include ':app'
        EOF

        cat << 'EOF' > android/build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.1.1'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        cat << 'EOF' > android/app/build.gradle
        plugins {
            id 'com.android.application'
        }

        android {
            namespace 'com.bible.verseapp'
            compileSdk 33

            defaultConfig {
                applicationId "com.bible.verseapp"
                minSdk 21
                targetSdk 33
                versionCode 1
                versionName "1.0"
            }

            buildTypes {
                release {
                    minifyEnabled false
                }
            }
        }
        EOF

        cat << 'EOF' > android/app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application
                android:allowBackup="true"
                android:label="말씀 한 장"
                android:icon="@mipmap/ic_launcher"
                android:roundIcon="@mipmap/ic_launcher_round"
                android:supportsRtl="true"
                android:theme="@android:style/Theme.NoTitleBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        cat << 'EOF' > android/app/src/main/java/com/bible/verseapp/MainActivity.java
        package com.bible.verseapp;

        import android.app.Activity;
        import android.os.Bundle;
        import android.webkit.WebSettings;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;

        public class MainActivity extends Activity {
            private WebView webView;

            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                webView = new WebView(this);
                WebSettings settings = webView.getSettings();
                settings.setJavaScriptEnabled(true);
                settings.setDomStorageEnabled(true);
                settings.setAllowFileAccessFromFileURLs(true);
                settings.setAllowUniversalAccessFromFileURLs(true);
                webView.setWebViewClient(new WebViewClient());
                webView.loadUrl("file:///android_asset/index.html");
                setContentView(webView);
            }

            @Override
            public void onBackPressed() {
                if (webView.canGoBack()) {
                    webView.goBack();
                } else {
                    super.onBackPressed();
                }
            }
        }
        EOF

    - name: Build Android APK with Gradle
      run: |
        cd android
        gradle assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: 말씀한장-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
